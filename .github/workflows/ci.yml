name: CI CD-Pipeline
on:
    push:
        branches:
            - main

env:
    BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/todo-backend:${{ github.sha }}
    FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/todo-frontend:${{ github.sha }}
    AZURE_RESOURCE_GROUP: akvelon-tasks
    CONTAINER_APP_NAME: todo

permissions:
    id-token: write   
    contents: read

jobs:
    build-test:
        name: Build and Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Set up Dotnet
              uses: actions/setup-dotnet@v6
              with:
                dotnet-version: '10.0.x'
            - name: Build Code
              run: dotnet build -c Release
            - name: Run Tests
              run: dotnet test ./Todo.Backend.Tests --no-build -c Release
    docker:
        runs-on: ubuntu-latest
        name: Build Docker Images
        needs: build-test
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}

            - name: Build and Push Frontend
              uses: docker/build-push-action@v6
              with:
                file: ./Todo.Frontend/Dockerfile
                context: .
                push: true
                tags: ${{ env.FRONTEND_IMAGE }}

            - name: Build and Push Backend
              uses: docker/build-push-action@v6
              with:
                file: ./Todo.Backend/Dockerfile
                context: .
                push: true
                tags: ${{ env.BACKEND_IMAGE }}
    deploy:
        runs-on: ubuntu-latest
        name: Deploy to Azure
        needs: docker
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Login to Azure
              uses: azure/login@v2
              with:
                client-id: ${{ secrets.AZURE_CLIENT_ID }}
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            - name: Deploy Infrastructure
              run: |
               az deployment group create \
               --resource-group ${{env.AZURE_RESOURCE_GROUP}} \
               --template-file main.bicep \
               --parameters containerAppName=${{env.CONTAINER_APP_NAME}} frontendImage=${{env.FRONTEND_IMAGE}} backendImage=${{env.BACKEND_IMAGE}}


    
        